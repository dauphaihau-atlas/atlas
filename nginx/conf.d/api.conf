server {
    listen 80;
    server_name api.admin-dashboard.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.admin-dashboard.local;

    ssl_certificate /etc/nginx/certs/api.admin-dashboard.local.crt;
    ssl_certificate_key /etc/nginx/certs/api.admin-dashboard.local.key;

    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 100M;

    # Reverb WebSocket (Pusher-compatible paths)
    location ~ ^/(app|apps)/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
