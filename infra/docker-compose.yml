name: atlas

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  dashboard_node_modules:

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: atlas-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ../apps/api:/var/www/html:ro
    depends_on:
      - php
      - dashboard
    networks: [app_network]

  php:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: atlas-php
    restart: unless-stopped
    volumes:
      - ../apps/api:/var/www/html
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [app_network]
    env_file: ../apps/api/.env
    environment:
      GO_WORKER_URL: http://worker-go:8080
      GO_WORKER_INTERNAL_TOKEN: atlas-local-internal-token

  horizon:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: atlas-horizon
    restart: unless-stopped
    command: ["php", "artisan", "horizon"]
    volumes:
      - ../apps/api:/var/www/html
    depends_on:
      php:
        condition: service_started
      redis:
        condition: service_healthy
    networks: [app_network]
    env_file: ../apps/api/.env

  reverb:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: atlas-reverb
    restart: unless-stopped
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080", "--debug"]
    volumes:
      - ../apps/api:/var/www/html
    depends_on:
      php:
        condition: service_started
      redis:
        condition: service_healthy
    networks: [app_network]
    env_file: ../apps/api/.env

  worker-go:
    build:
      context: ../apps/worker-go
      dockerfile: Dockerfile
    container_name: atlas-worker-go
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      nginx:
        condition: service_started
    networks: [app_network]
    environment:
      HTTP_ADDR: :8080
      LARAVEL_INTERNAL_URL: http://nginx:8080
      LARAVEL_INTERNAL_TOKEN: atlas-local-internal-token
      IMPORT_CHUNK_SIZE: "500"

  dashboard:
    build:
      context: ../apps/dashboard
      dockerfile: Dockerfile
    container_name: atlas-dashboard
    restart: unless-stopped
    volumes:
      - ../apps/dashboard:/app
      - ../packages:/app/packages
      - dashboard_node_modules:/app/node_modules
    environment:
      VITE_PACKAGES_PATH: /app/packages
      # Docker bind mounts can miss native file events, so force polling for Vite dev watch.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    networks: [app_network]
    env_file: ../apps/dashboard/.env

  postgres:
    image: postgres:16-alpine
    container_name: atlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [app_network]

  redis:
    image: redis:7-alpine
    container_name: atlas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [app_network]

  minio:
    image: minio/minio:latest
    container_name: atlas-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [app_network]

  mailpit:
    image: axllent/mailpit:latest
    container_name: atlas-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks: [app_network]
