server {
    listen 80;
    server_name api.atlas.local;
    return 301 https://$host$request_uri;
}

server {
    listen 8080;
    server_name nginx;

    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* { deny all; }
}

server {
    listen 443 ssl;
    server_name api.atlas.local;

    ssl_certificate /etc/nginx/certs/api.atlas.local.crt;
    ssl_certificate_key /etc/nginx/certs/api.atlas.local.key;
    resolver 127.0.0.11 valid=10s;
    set $reverb_upstream http://reverb:8080;

    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 100M;

    # Reverb WebSocket (Pusher-compatible paths)
    location ~ ^/(app|apps)/ {
        proxy_pass $reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
