map $http_upgrade $dashboard_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name app.atlas.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.atlas.local;

    ssl_certificate /etc/nginx/certs/app.atlas.local.crt;
    ssl_certificate_key /etc/nginx/certs/app.atlas.local.key;

    resolver 127.0.0.11 valid=10s;
    set $dashboard http://dashboard:5173;

    location / {
        proxy_pass $dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dashboard_connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
}
